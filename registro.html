<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="txGrande">
        Registrate a continuacion
    </div>
    <div class="txMediano">
        Llena los campos solicitado para continuar con tu resgistro
    </div>
    <div class="registro">
        <form id="registro">
            <br>
            <label for="nombre">Nombre: </label>
            <input type="text" id="nombre" name="nombre" required>
            </br>
            <br>
            <label for="identificacion">Identificación: </label>
            <input type="text" id="identificacion" name="id" required>
            </br>
            <br>
            <label for="correo">Correo: </label>
            <input type="text" id="correo" name="correo" required>
            </br>
            <br>
            <label for="telefono">Teléfono: </label>
            <input type="text" id="telefono" name="telefono" required>
            </br>
            <br>
            <label for="Genero">Genero:</label>
            <label for="Masculino">Masculino: </label>
            <input type="radio" id="Masculino" name="genero" value="Masculino" required>
            <br>
            <label for="Femenino">Femenino</label>
            <input type="radio" id="Femenino" name="genero" value="Femenino" required>
            </br>
            <button type="submit">Registrarme</button>
        </form>
    </div>
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script type="text/javascript">
        emailjs.init('u6EV0CFY1NLBo-sVk')
    </script>
</body>

</html>
